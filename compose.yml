# Linux desktop deployment: run as the owner of the mounted session bus.
services:
  localert:
    image: ghcr.io/truefix/localert:${LOCALERT_VERSION:-latest}
    build:
      context: .
      args:
        VERSION: ${LOCALERT_VERSION:-dev}
    user: "${LOCALERT_UID:?Set LOCALERT_UID to id -u}:${LOCALERT_GID:?Set LOCALERT_GID to id -g}"
    network_mode: host
    command: ["--addr", "127.0.0.1:8787", "--data-dir", "/data", "--no-open", "--container"]
    environment:
      DBUS_SESSION_BUS_ADDRESS: unix:path=/run/localert-session-bus
    volumes:
      - type: bind
        source: ${XDG_RUNTIME_DIR:?Set XDG_RUNTIME_DIR to your desktop runtime directory}/bus
        target: /run/localert-session-bus
        bind:
          create_host_path: false
      - type: bind
        source: ${LOCALERT_DATA_DIR:-./localert-data}
        target: /data
        bind:
          create_host_path: false
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp:rw,nosuid,nodev,size=32m
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
